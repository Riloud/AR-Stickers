<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

<style>

body{
margin:0;
overflow:hidden;
}

</style>

</head>

<body>

<a-scene

mindar-image="imageTargetSrc: targets.mind; maxTrack: 3;"

color-space="sRGB"

renderer="colorManagement: true, physicallyCorrectLights"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false"									
  
>

<a-assets>

<a-asset-item id="avatar" src="messiCard2.glb"> </a-asset-item>
<a-asset-item id="claSonicRun" src="classicSonicRun2.glb"> </a-asset-item>
<a-asset-item id="pixelMario" src="voxel_mario_amiibo2.glb"> </a-asset-item>


<audio id="bgMusic" src="sonic-green-hill-zone.mp3" loop> </audio>
  
</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
  
</a-camera>

<a-entity
mindar-image-target="targetIndex: 0">
<a-gltf-model src="#avatar" position="0 -1.3 0" rotation="0 0 0" scale="0.7 0.7 0.7" animation-mixer> </a-gltf-model>
</a-entity>

<a-entity
mindar-image-target="targetIndex: 1">
<a-gltf-model src="#claSonicRun" class="clickable" position="0 -1 0" rotation="0 30 0" scale="0.4 0.4 0.4" animation-mixer="timeScale: 3;"> </a-gltf-model>
</a-entity>


<a-entity
mindar-image-target="targetIndex: 2">
<a-gltf-model src="#pixelMario" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer> </a-gltf-model>
</a-entity>


  
</a-scene>

<script>

const music = document.getElementById("bgMusic");
const targets = document.querySelectorAll('[mindar-image-target]');

let visibleTargets = 0;

targets.forEach(target => {
  target.addEventListener('targetFound',() => 
    {
      visibleTargets++;
      if(visibleTargets === 1)
      {
        music.play();    
      }
    }
  );
    
  target.addEventListener('targetLost',() =>
    {
      visibleTargets--;

      if(visibleTargets <= 0)
      {
        visibleTargets = 0;
        music.pause();
      }
    }
  );
});

</script>
  
</body>

</html>
